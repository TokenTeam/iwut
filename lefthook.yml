min_version: 2.1.10

pre-commit:
  parallel: true
  jobs:
    - name: eslint
      glob:
        - "*.{js,cjs,mjs,jsx,ts,tsx}"
        - "**/*.{js,cjs,mjs,jsx,ts,tsx}"
      run: bunx eslint '{staged_files}'

    - name: prettier
      glob:
        - "*.{json,md,yml,yaml,css}"
        - "**/*.{json,md,yml,yaml,css}"
      run: bunx prettier --check '{staged_files}'

    - name: i18n
      glob: "lib/i18n/locales/*.json"
      run: bun run i18n-check

pre-push:
  jobs:
    - run: bun run check

commit-msg:
  jobs:
    - run: bun scripts/commit-check.ts {1}
